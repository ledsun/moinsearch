name: Build and test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore moinsearch.slnx

      - name: Build
        run: dotnet build moinsearch.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test moinsearch.slnx --configuration Release --no-build
