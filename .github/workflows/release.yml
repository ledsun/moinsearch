name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore moinsearch.slnx --locked-mode

      - name: Test
        run: dotnet test moinsearch.slnx --configuration Release --no-restore

      - name: Publish Native AOT executable
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Tag '$tag' must use vMAJOR.MINOR.PATCH format, e.g. v0.0.1."
          }
          $version = $Matches.version
          dotnet publish src/Moinsearch -c Release -r win-x64 --self-contained --no-restore -p:PublishAot=true "-p:Version=$version"

      - name: Package release asset
        shell: pwsh
        run: |
          $publishDirectory = "src\Moinsearch\bin\Release\net10.0\win-x64\publish"
          $packageDirectory = Join-Path $env:RUNNER_TEMP "moinsearch-$($env:GITHUB_REF_NAME)-win-x64"
          $archivePath = Join-Path $env:RUNNER_TEMP "moinsearch-$($env:GITHUB_REF_NAME)-win-x64.zip"

          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null
          Copy-Item (Join-Path $publishDirectory "moinsearch.exe") $packageDirectory
          Copy-Item README.md, LICENSE $packageDirectory
          Compress-Archive -Path (Join-Path $packageDirectory "*") -DestinationPath $archivePath -CompressionLevel Optimal

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $archivePath = Join-Path $env:RUNNER_TEMP "moinsearch-${tag}-win-x64.zip"
          gh release create $tag $archivePath --verify-tag --title $tag --generate-notes
